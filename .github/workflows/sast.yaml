name: SAST Security Scan

# SAST via Semgrep, consumindo o template reutilizável centralizado da organização
# (DW-Deepwin/sbnia-security). Substitui a execução standalone do Horusec.
#
# Comportamento:
#   - pull_request / push: job `sast` roda o scan completo (report, não bloqueia).
#   - merge_group: job `sast-security-gate` roda antes do merge (bloqueia por
#     findings acima de fail_on_severity). Requer Merge Queue habilitado no
#     branch protection.

on:
  pull_request:
    branches:
      - main
      - development
  push:
    branches:
      - main
      - development
  merge_group:

jobs:
  sast:
    uses: DW-Deepwin/sbnia-security/.github/workflows/sast-template.yaml@main
